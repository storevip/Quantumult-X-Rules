# ==================================================
# Quantumult X - AI Policy
# https://github.com/storevip/Quantumult-X-Rules
#
# 使用方法：
# 将 [policy] 下方的策略复制到自己的 Quantumult X 配置中
# ==================================================

[policy]

# 🇺🇸 美国节点
static = 🇺🇸 美国节点, server-tag-regex=(🇺🇸|美国|美國|United States|UnitedStates|USA|U\.S\.|(^|[^A-Za-z])US([^A-Za-z]|$))

# 🇯🇵 日本节点
static = 🇯🇵 日本节点, server-tag-regex=(🇯🇵|日本|Japan|JAPAN|JPN|(^|[^A-Za-z])JP([^A-Za-z]|$))

# 🇹🇼 台湾节点
static = 🇹🇼 台湾节点, server-tag-regex=(🇹🇼|台湾|台灣|Taiwan|TAIWAN|TWN|(^|[^A-Za-z])TW([^A-Za-z]|$))

# 🇸🇬 新加坡节点
static = 🇸🇬 新加坡节点, server-tag-regex=(🇸🇬|新加坡|狮城|獅城|Singapore|SINGAPORE|SGP|(^|[^A-Za-z])SG([^A-Za-z]|$))

# 🇰🇷 韩国节点
static = 🇰🇷 韩国节点, server-tag-regex=(🇰🇷|韩国|韓國|南韩|南韓|Korea|KOREA|South Korea|KOR|(^|[^A-Za-z])KR([^A-Za-z]|$))

# 🤖 AI 总策略
# static 策略一次只会使用一个当前选中的地区组，不会同时向多个节点发送流量
# 不加入内置 proxy，避免 AI 出口跟随 Quantumult X 的全局代理选择变化
static = AI, 🇺🇸 美国节点, 🇯🇵 日本节点, 🇹🇼 台湾节点, 🇸🇬 新加坡节点, 🇰🇷 韩国节点
